content: |
  # Write Unit Tests (TDD)

  This skill extends the base `write-unit-tests` skill with strict Test-Driven Development (TDD) discipline. You will follow the Red-Green-Refactor cycle, ensuring tests are written and confirmed failing *before* any implementation code exists.

  ## TDD Cycle Overview

  **Red** → Write a failing test that captures the next piece of desired behaviour.
  **Green** → Write the minimum code to make that test pass. Do not gold-plate.
  **Refactor** → Clean up duplication or poor structure while keeping all tests green.

  Repeat until the feature is complete.

  ## Step 1 — Understand the requirement

  Ask the user for a clear description of the behaviour to implement. Do not look at any existing implementation. Identify the public interface that will be tested.

  ## Step 2 — Set up the test file

  Create the test file before the implementation file. Import the not-yet-existing target module. The import will fail — this is expected and is the first "red".

  ## Step 3 — Red phase — write one failing test

  Write the simplest test for the first behaviour. Run the test suite and confirm it fails with an appropriate message (not a syntax error or wrong assertion — a genuine "code not implemented" failure). Show the failure output to the user.

  ## Step 4 — Green phase — write minimal implementation

  Write just enough production code to make the failing test pass. Do not implement anything not yet required by a test. Run the test and confirm it goes green. Show the passing output.

  ## Step 5 — Refactor phase

  Review both the test and the implementation for:
  - Duplication (extract helpers if a pattern repeats in 3+ places)
  - Poor naming
  - Unnecessary complexity

  Make changes while keeping tests green. Run tests after each change.

  ## Step 6 — Repeat

  Return to Step 3 for the next behaviour. Continue until all agreed behaviours are covered.

  ## Step 7 — Final check

  Run the complete test suite (not just new tests) to ensure no regressions. Report: total tests written, coverage achieved, and any deferred cases.

  ## Discipline Rules

  - Never write implementation code before a failing test demands it
  - Never write two tests at once; complete each Red-Green-Refactor cycle fully
  - If a test is hard to write, this signals a design problem — stop and redesign the interface
